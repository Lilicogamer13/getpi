name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: getpi-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: getpi-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: getpi-windows-x86_64.exe
            ext: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: getpi-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: getpi-macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/getpi${{ matrix.ext }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v[0-9]*' | sed 's/^v//' | sort -n | tail -n1)
          next=$(( ${latest:-0} + 1 ))
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          | File | Platform |
          |---|---|
          | `getpi-linux-x86_64` | Linux, 64-bit Intel/AMD (static, runs on glibc and musl distros) |
          | `getpi-linux-aarch64` | Linux, 64-bit ARM (Raspberry Pi 3/4/5 on a 64-bit OS, ARM servers) |
          | `getpi-windows-x86_64.exe` | Windows, 64-bit |
          | `getpi-macos-arm64` | macOS, Apple Silicon (M1 and later) |
          | `getpi-macos-x86_64` | macOS, Intel |
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file notes.md
