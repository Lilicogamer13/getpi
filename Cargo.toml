[package]
name = "getpi"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

